# Merge these keys into the existing Mihomo dns: mapping. Keep your current
# enhanced-mode, fake-ip-range, fake-ip-filter, and other local settings.
dns:
  enable: true
  ipv6: false
  respect-rules: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
    - "https://223.6.6.6/dns-query#DIRECT"
  nameserver:
    - "https://1.1.1.1/dns-query#Proxy"
    - "https://1.0.0.1/dns-query#Proxy"
  nameserver-policy:
    "geosite:cn":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://223.6.6.6/dns-query#DIRECT"
